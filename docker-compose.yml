services:
  postgres:
    image: postgres:16-alpine
    container_name: boxora_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boxora
    ports:
      - "5436:5432"
    volumes:
      - boxora_pgdata:/var/lib/postgresql/data

volumes:
  boxora_pgdata:

